[project]
name = "corsproxy-service"
version = "0.1.0"
description = "Managed CORS and HTTP(S) forward proxy with IP intelligence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
corsproxy = "corsproxy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

